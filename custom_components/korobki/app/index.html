<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Коробки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffc107">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Коробки</title>
<script>try { var th = localStorage.getItem('korobki-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<style>
  /* Переменные названы как в Home Assistant: панель берёт цвета отсюда (наследуются в shadow DOM) */
  :root { color-scheme: light dark;
    --primary-background-color:#f2f4f8; --card-background-color:#fff; --primary-text-color:#16202c; --secondary-text-color:#64738a;
    --divider-color:#d9e0ea; --primary-color:#4f729f; --error-color:#c62828; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --primary-background-color:#111418; --card-background-color:#1c2128; --primary-text-color:#e6e9ee; --secondary-text-color:#9aa4b2;
    --divider-color:#2c333d; --primary-color:#6f9bd1; --error-color:#ef5350; } }
  :root[data-theme="dark"] { color-scheme: dark;
    --primary-background-color:#111418; --card-background-color:#1c2128; --primary-text-color:#e6e9ee; --secondary-text-color:#9aa4b2;
    --divider-color:#2c333d; --primary-color:#6f9bd1; --error-color:#ef5350; }
  :root[data-theme="light"] { color-scheme: light; }
  /* Документ не прокручивается: прокручивается только панель. Так iOS не оставляет пустую полосу после клавиатуры */
  html, body { margin:0; position:fixed; inset:0 0 -200px 0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
    background:var(--primary-background-color); color:var(--primary-text-color); font:15px -apple-system, system-ui, sans-serif; }
  /* Панель занимает видимую область (top/bottom), без минимальной высоты: lvh на iPhone делал её выше экрана на нижнюю полосу */
  korobki-panel { display:block; position:fixed; top:0; left:0; right:0; bottom:0; height:auto; }
  /* Фон-стекло рисует html: иначе полоса под панелью (если iOS отдаёт ей меньше высоты) была бы другого цвета */
  html { background: linear-gradient(170deg, color-mix(in srgb, #5b8cff 16%, var(--primary-background-color)), color-mix(in srgb, #b06bff 13%, var(--primary-background-color)) 55%, color-mix(in srgb, #ff8fb1 14%, var(--primary-background-color))) fixed; }
  body { background: transparent; }
  korobki-panel { --kb-bg: transparent; }
  #login { box-sizing:border-box; max-width:460px; margin:0 auto; padding:max(24px, calc(env(safe-area-inset-top) + 16px)) 20px 24px; display:flex; flex-direction:column; gap:12px; }
  #login[hidden] { display:none; }
  #login h1 { margin:8px 0 0; }
  #login p { margin:0; color:var(--secondary-text-color); line-height:1.4; }
  #login input, #login button { font:inherit; padding:12px; border-radius:12px; border:1px solid var(--divider-color); background:var(--card-background-color); color:var(--primary-text-color); }
  #login button { background:#ffc107; color:#222; font-weight:600; border:0; }
  #err { color:var(--error-color); min-height:1.2em; }
</style></head><body>
<form id="login" hidden>
  <h1>Коробки</h1>
  <p>Вставьте долгосрочный токен Home Assistant: профиль → «Безопасность» → «Долгосрочные токены доступа» → «Создать токен». Он хранится только на этом устройстве. Лучше создать отдельного пользователя Home Assistant только для Коробок и взять токен у него.</p>
  <input id="tok" type="password" autocomplete="off" placeholder="Токен" required>
  <button type="submit">Войти</button>
  <div id="err"></div>
</form>
<script>
(function () {
  var KEY = 'korobki-token', SKEY = 'korobki-server', LKEY = 'korobki-local', tok = '', BASE = '';
  try { BASE = localStorage.getItem(SKEY) || ''; } catch (e) {}
  /* Локальный адрес убран в 0.8.0: чистим старую настройку */
  try { localStorage.removeItem(LKEY); } catch (e) {}
  try { tok = localStorage.getItem(KEY) || ''; } catch (e) {}
  var login = document.getElementById('login');
  function req(method, path, body, type, signal) {
    var h = { Authorization: 'Bearer ' + tok }, init = { method: method, headers: h };
    if (signal) init.signal = signal;
    if (body != null) {
      if (body instanceof Blob) { init.body = body; h['Content-Type'] = type || 'image/jpeg'; }
      else { init.body = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
    }
    return fetch(BASE + path, init);
  }
  function start() {
    login.hidden = true;
    var s = document.createElement('script');
    s.src = '/korobki_static/korobki-panel.js';
    s.onload = function () {
      var el = document.createElement('korobki-panel');
      document.body.appendChild(el);
      el.transport = {
        kind: 'pwa', request: req,
        server: {
          get: function () { return BASE; },
          set: function (v) {
            v = (v || '').trim().replace(/\/+$/, '');
            if (v && !/^https?:\/\//i.test(v)) return Promise.reject(new Error('Адрес должен начинаться с http:// или https://'));
            var old = BASE; BASE = v;
            return req('POST', '/api/korobki/sync', { since: 0, records: [] }).then(function (r) {
              if (r.status === 401 || r.status === 403) throw new Error('Токен не подошёл на этом сервере');
              if (!r.ok) throw new Error('Ошибка ' + r.status);
              try { if (v) localStorage.setItem(SKEY, v); else localStorage.removeItem(SKEY); } catch (e) {}
            }).catch(function (e) { BASE = old; throw e; });
          }
        },
        theme: function (v) {
          var cur = 'auto';
          try { cur = localStorage.getItem('korobki-theme') || 'auto'; } catch (e) {}
          if (v === undefined) return cur;
          try { if (v === 'auto') localStorage.removeItem('korobki-theme'); else localStorage.setItem('korobki-theme', v); } catch (e) {}
          if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
        },
        reauth: function () { el.remove(); login.hidden = false; },
        logout: function () { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); }
      };
    };
    document.head.appendChild(s);
  }
  if (tok) start(); else login.hidden = false;
  login.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('tok').value.trim(), err = document.getElementById('err');
    err.textContent = '';
    if (!v) return;
    var old = tok; tok = v;
    req('POST', '/api/korobki/sync', { since: 0, records: [] }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error('Токен не подошёл');
      if (!r.ok) throw new Error('Ошибка ' + r.status);
      try { localStorage.setItem(KEY, v); } catch (x) {}
      start();
    }).catch(function (x) { tok = old; err.textContent = x.message === 'Failed to fetch' ? 'Нет связи с Home Assistant' : x.message; });
  });
  /* iOS после клавиатуры иногда оставляет страницу сдвинутой (снизу чёрная/белая полоса): возвращаем в 0 */
  function unshift() {
    var ae = document.activeElement, deep = ae && ae.shadowRoot ? ae.shadowRoot.activeElement : ae;
    if (deep && /^(INPUT|TEXTAREA|SELECT)$/.test(deep.tagName)) return;
    window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  }
  document.addEventListener('focusout', function () { setTimeout(unshift, 60); setTimeout(unshift, 350); }, true);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setTimeout(unshift, 60); });
  window.addEventListener('orientationchange', function () { setTimeout(unshift, 300); });
  /* Обновление: новый воркер появляется вместе с новой версией. Если страница уже работала под старым, сообщаем панели:
     она покажет кнопку «Обновить». Проверка идёт при запуске, при возврате в приложение и раз в 30 минут. */
  if ('serviceWorker' in navigator) {
    var hadCtl = !!navigator.serviceWorker.controller, reg = null;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadCtl) window.dispatchEvent(new Event('korobki-update'));
      hadCtl = true;
    });
    navigator.serviceWorker.register('sw.js').then(function (r) { reg = r; r.update().catch(function () {}); }).catch(function () {});
    var chk = function () { if (reg) reg.update().catch(function () {}); };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') chk(); });
    setInterval(chk, 30 * 60 * 1000);
  }
})();
</script></body></html>
